  <script>
    function twoDigit(num) {
      let ret;
      if( num < 10 ) 
	    ret = "0" + num; 
      else 
   	    ret = num; 
      return ret;
    }
    function showClock() {

      var weeks = new Array('日', '月', '火', '水', '木', '金', '土');

      let nowTime = new Date();
      let nowYear = nowTime.getFullYear();
      let nowMonth = ('00' + (nowTime.getMonth()+1)).slice(-2);
      let nowDate = twoDigit( nowTime.getDate() );
      let nowWeek = weeks[nowTime.getDay()];
      let nowHour = twoDigit( nowTime.getHours() );
      let nowMin  = twoDigit( nowTime.getMinutes() );
      let nowSec  = twoDigit( nowTime.getSeconds() );
      let msg = "<p style='font-size:100px;margin:0;color:white;'>" + nowYear + "/" + nowMonth + "/" + nowDate + "("+ nowWeek +")</p><p style='justify-content:center;align-items: center;display: flex;font-size:200px;color:black;background-color:white;margin:0;'>" + nowHour + ":" + nowMin + ":" + nowSec;
      document.getElementById("realtime").innerHTML = msg;
    }

    setInterval('showClock()',1000);
  </script>

// 都市名から緯度・経度を取得する関数
async function getCoordinates(cityName) {
  const url =
    "https://geocoding-api.open-meteo.com/v1/search?name=" +
    encodeURIComponent(cityName) +
    "&count=1&language=ja";

  const response = await fetch(url);
  if (!response.ok) throw new Error("都市情報の取得に失敗しました");

  const data = await response.json();
  if (!data.results || data.results.length === 0) {
    throw new Error("都市が見つかりませんでした：" + cityName);
  }

  return {
    name:           data.results[0].name,
    latitude:       data.results[0].latitude,
    longitude:      data.results[0].longitude,
  };
}

// 緯度・経度から天気を取得する関数
async function getWeather(latitude, longitude) {
  const url =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + latitude +
    "&longitude=" + longitude +
    "&current=temperature_2m,weathercode,relative_humidity_2m" +
    "&timezone=Asia%2FTokyo";

  const response = await fetch(url);
  if (!response.ok) throw new Error("天気情報の取得に失敗しました");

  const data = await response.json();
  console.log(data);
  return data.current;

}
//こっち一週間分
async function getDailyWeather() {
  const dailyURL = 
    "https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo";

  const response2 = await fetch(dailyURL);
  if (!response2.ok) throw new Error("一週間天気情報の取得に失敗しました");

  const dailyData = await response2.json();
  console.log(dailyData);
  return dailyData.daily;
}
